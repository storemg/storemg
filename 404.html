    <title>MG Store</title>

      Com o site usando HashRouter (rotas como /#/admin), este arquivo

      internas, só a parte antes do "#" importa para o GitHub Pages.
      Isso aqui é só uma rede de segurança para um link direto quebrado.
    -->

  </head>

    <p>Redirecionando para a <a href="./">MG Store</a>…</p>
  </body>
