    <!--
      Truque necessário para GitHub Pages funcionar como SPA.
      GitHub Pages não tem servidor configurável: quando alguém acessa
      diretamente /admin ou dá F5 numa rota interna, o GitHub devolve
      404.html. O 404.html (veja /public/404.html) redireciona para cá
      guardando a rota original numa query string, e este script abaixo
      restaura a URL certa antes do React Router assumir.
      Sem isso, /admin funcionaria só navegando pelo site, e quebraria
      no F5 ou em link direto.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })(window.location)
    </script>
